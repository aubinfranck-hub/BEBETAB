name: Build BEBETAB Android APK

on:
  workflow_dispatch:
  pull_request:
    paths: ["android/**"]
  push:
    paths:
      - "android/**"
      - "src/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Build native Kotlin APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload Kotlin APK
        uses: actions/upload-artifact@v4
        with:
          name: BEBETAB-Kotlin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test APK (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk bebetab-test.apk
          if gh release view test-apk >/dev/null 2>&1; then
            gh release upload test-apk bebetab-test.apk --clobber
          else
            gh release create test-apk bebetab-test.apk --prerelease --target "$GITHUB_SHA" \
              --title "BébéTab APK de test" \
              --notes "APK debug pour tester sur tablette. Non signé avec la clé de production."
          fi
