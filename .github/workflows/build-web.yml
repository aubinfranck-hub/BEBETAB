name: Verify BEBETAB web
on:
  push:
    paths: ['src/**', 'public/**', 'server.ts', 'package*.json', 'scripts/**', '.github/workflows/build-web.yml']
  pull_request:
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
