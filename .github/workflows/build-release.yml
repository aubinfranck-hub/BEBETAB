name: Build BEBETAB Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.BEBETAB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "${{ github.workspace }}/bebetab-release.jks"
          fi

      - name: Build release APK
        working-directory: android
        env:
          BEBETAB_KEYSTORE_FILE: ${{ github.workspace }}/bebetab-release.jks
          BEBETAB_KEYSTORE_PASSWORD: ${{ secrets.BEBETAB_KEYSTORE_PASSWORD }}
          BEBETAB_KEY_ALIAS: ${{ secrets.BEBETAB_KEY_ALIAS }}
          BEBETAB_KEY_PASSWORD: ${{ secrets.BEBETAB_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Read version
        id: version
        run: |
          VERSION_CODE=$(grep 'versionCode =' android/app/build.gradle.kts | head -1 | sed 's/[^0-9]*//g')
          VERSION_NAME=$(grep 'versionName =' android/app/build.gradle.kts | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Check signing
        id: signing
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release APK
        if: steps.signing.outputs.signed == 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk bebetab-release.apk

      - name: Publish GitHub Release
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          gh release create "v$VERSION" bebetab-release.apk \
            --title "BébéTab v$VERSION" \
            --notes "Mise à jour automatique de BébéTab."

      - name: Calculate SHA-256
        if: steps.signing.outputs.signed == 'true'
        id: sha
        run: echo "sha256=$(sha256sum bebetab-release.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update update.json
        if: steps.signing.outputs.signed == 'true'
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("update.json")
          data = json.loads(p.read_text())
          data["versionCode"] = int(__import__("os").environ["VERSION_CODE"])
          data["versionName"] = __import__("os").environ["VERSION_NAME"]
          data["apkUrl"] = f"https://github.com/aubinfranck-hub/BEBETAB/releases/download/v{data['versionName']}/bebetab-release.apk"
          data["sha256"] = __import__("os").environ["SHA256"]
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Commit update manifest
        if: steps.signing.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "chore(update): publish v$VERSION manifest"
          git push

      - name: Upload unsigned fallback artifact
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BEBETAB-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
